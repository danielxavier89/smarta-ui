name: CI

# The repository had no automated anything: no tests, no workflows, and the
# accessibility addon set to "todo" so violations failed nothing. This is the
# gate. Nothing merges past a red run — see .github/branch-protection.json for the
# settings that make that true, which have to be applied in the repository's
# own configuration and cannot live in a file.

on:
  push:
    branches: [main]
  pull_request:
  # So a dependency advisory does not sit undiscovered until the next commit.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Storybook 9 and Vite 7 both want a current Node, and this is the
          # version netlify.toml pins for the deploy. They must not drift.
          node-version: "20"
          cache: npm

      # ci, not install: it installs exactly the lockfile and fails if
      # package.json and package-lock.json disagree.
      - name: Install
        run: npm ci

      # typecheck, no hardcoded colours, no hardcoded English, contrast across
      # the four themes, and the component inventory regenerated from source.
      - name: Check
        run: npm run check

      # The inventory is generated. If `check` changed it, the committed copy
      # was stale and the docs were lying about what exists.
      - name: The generated inventory is committed
        run: git diff --exit-code -- packages/ui/docs/inventory.md

      - name: Build the library
        run: npm run build

      # Behaviour, not appearance: keyboard, focus, overlays opening and
      # closing, forms, upload, disabled and loading, the providers, the labels
      # layer, the formatting helpers, and axe over a composed surface.
      #
      # The axe run loops the four product/mode combinations, but no component
      # branches on either and the tests load no CSS — so it is three assertions
      # run four times, kept as insurance rather than as evidence about theming.
      # Contrast cannot run under jsdom; `npm run check` covers it.
      - name: Test
        run: npm test

      # The check that would have caught the package being unusable: resolve it
      # through its exports map and build it with both products' bundlers.
      - name: Consumer build (Webpack and Vite)
        run: npm run test:consumer

      # Compiles the stories. It does NOT execute them, so the a11y addon's
      # own run is not a gate here — that is packages/ui/src/test/a11y.test.tsx,
      # in the Test step above. Making the addon block CI would mean adding
      # @storybook/addon-vitest and a test-storybook step.
      - name: Build Storybook
        run: npm run build-storybook

  # Separate job so an advisory is visible as its own red mark rather than
  # buried in the middle of the build's log.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Production dependencies are what reaches a product. A dev-only advisory
      # is reported by the scheduled run and Dependabot without blocking a PR
      # that has nothing to do with it.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
